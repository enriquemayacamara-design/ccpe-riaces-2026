<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de evaluadores · CCPE-RIACES 2026</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261126e">
<style>
main{padding:30px 0 40px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 18px}
.bar .grow{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.kpis{grid-template-columns:repeat(5,1fr)}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.chart{padding:18px}
.chart h3{margin-bottom:4px}
.chart .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chart svg text.v{fill:var(--text);font-weight:600}
.chart svg .grid{stroke:var(--line)}
.chart svg .ink{stroke:var(--text)}
.chart svg .hole{fill:var(--bg);stroke:var(--text)}
.wait{padding:22px;margin-top:14px;display:flex;gap:14px;align-items:center;border-left:4px solid var(--accent)}
.tbl{padding:18px;margin-top:14px;overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child,.tbl td.l,.tbl th.l{text-align:left}
.tbl thead th{border-top:1.5px solid var(--text);border-bottom:1.5px solid var(--text);font-weight:600;font-size:12px}
.tbl caption{text-align:left;font-size:13px;color:var(--muted);padding-bottom:8px;caption-side:top}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:1px}
.hb{display:grid;grid-template-columns:minmax(120px,220px) 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hb i{display:block;height:12px;background:var(--accent);border-radius:2px}
.sec{margin-top:34px}
.sec>h2{margin-bottom:4px}
.err{margin-top:16px;padding:12px 16px;border-radius:8px;border-left:4px solid var(--red);background:var(--red-soft)}
/* acceso */
.login{max-width:440px;margin:70px auto;padding:30px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-top:18px}
input.t,select.t{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--text);font:inherit;font-weight:400}
input.t:focus,select.t:focus{border-color:var(--accent);outline:none}
/* barra de herramientas */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;margin-top:18px}
.tools .f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tools .f select{min-width:170px;text-transform:none;letter-spacing:0;font-size:14px}
.tools .exp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.who b{color:var(--text);font-weight:600}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline}
.printonly{display:none}
#tip{position:fixed;z-index:50;display:none;pointer-events:none;background:#1f1a1c;color:#fff;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:6px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{font-weight:700}
[data-tip]{cursor:help}
.chart svg rect[data-ses]{cursor:pointer}
.chart svg rect[data-ses]:hover{fill-opacity:.85}
.pngbtn{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:#fff;border-radius:5px;font:600 11px var(--body);color:var(--accent);padding:4px 8px;cursor:pointer}
.pngbtn:hover{border-color:var(--accent)}
.chart h3{padding-right:52px}
.qual{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);align-self:center;cursor:pointer}
.qual input{accent-color:var(--accent);width:16px;height:16px}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.dtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.dtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.dtabs input{margin-left:auto;min-width:220px}
.cmts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cmt{padding:14px 16px;border-left:3px solid var(--accent)}
.cmt p{white-space:pre-wrap;word-wrap:break-word}
.cmt small{display:block;margin-top:8px;color:var(--muted);font-size:12px}
@media (max-width:900px){.cmts{grid-template-columns:1fr}.dtabs input{margin-left:0;min-width:0;width:100%}}
@media (max-width:900px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.tools .exp{margin-left:0}}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#fff}
  header.top{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .who{display:none!important}
  .tools,.bar .grow,.noprint,.linkbtn{display:none!important}
  .printonly{display:block}
  .panel{break-inside:avoid}
  .sec{break-before:auto}
  .charts{grid-template-columns:1fr 1fr}
  body{font-size:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="assets/logo-riaces.png?v=20261126e" alt="RIACES · Red Iberoamericana para el Aseguramiento de la Calidad en la Educación Superior">
  <div class="brandtxt"><b>Panel de evaluadores</b><span>Diplomado Internacional de Pares Académicos Evaluadores 2026</span></div>
  <div class="who" id="who"></div>
</div></header>

<main class="wrap" id="app"></main>
<footer class="ft"><div class="wrap"><span>Enrique Maya Cámara en colaboración con RIACES</span><span>Intervalos de confianza del 95 % por el método de Wilson · p exacta de la t de Student.</span></div></footer>

<script src="config.js?v=20261126e"></script>
<script src="assets/meta.js?v=20261126e"></script>
<script src="assets/items.js?v=20261126e"></script>
<script src="assets/vendor/xlsx.full.min.js"></script>
<script>
const API=(window.CCPE_CONFIG||{}).API_URL||'';
const META=window.CCPE_META;
const MODS=['Perspectiva iberoamericana','Actuación estratégica','Innovación y juicio evaluativo'];
const SATG=[{c:'Contenidos',k:'Sat_contenidos',items:[['D1','Pertinencia de los contenidos'],['D2','Actualidad de los contenidos'],['D3','Lecturas y materiales'],['D4','Equilibrio teoría-práctica']]},
 {c:'Instructores',k:'Sat_instructores',items:[['D5','Dominio de los temas'],['D6','Claridad de las exposiciones'],['D7','Fomento de la participación'],['D8','Retroalimentación']]},
 {c:'Logística y dinámicas',k:'Sat_logistica',items:[['D9','Organización y comunicación'],['D10','Plataforma y sesiones sincrónicas'],['D11','Horario y duración'],['D12','Dinámicas de las sesiones']]},
 {c:'Valoración global',k:'Sat_global',items:[['D13','Satisfacción global']]}];
const SESS=['Comparación de sistemas y marcos','Indicadores, evidencias y juicio','Antes de la visita','Durante y después de la visita','IA, microcredenciales y trayectorias','Hallazgos, recomendaciones e informes'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- Estadística ---- */
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
const vr=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1);};
function pearson(x,y){if(x.length<3)return NaN;const mx=mean(x),my=mean(y);let n=0,dx=0,dy=0;for(let i=0;i<x.length;i++){n+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2;}return dx&&dy?n/Math.sqrt(dx*dy):NaN;}
// p bilateral exacta de la t de Student (beta incompleta regularizada)
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const ci of c)s+=ci/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break;}return h;}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
const pT=(t,df)=>ibeta(df/2,0.5,df/(df+t*t));
function paired(a,b){const d=b.map((v,i)=>v-a[i]);const n=d.length,md=mean(d),s=sd(d);if(n<2||!s)return{md,dz:NaN,t:NaN,df:n-1,p:NaN};const t=md/(s/Math.sqrt(n));return{md,dz:md/s,t,df:n-1,p:pT(t,n-1)};}
function kr20(M){const k=M[0].length;if(M.length<3)return NaN;const tot=M.map(r=>r.reduce((s,x)=>s+x,0));const v=vr(tot);if(!v)return NaN;let pq=0;for(let j=0;j<k;j++){const p=mean(M.map(r=>r[j]));pq+=p*(1-p);}return k/(k-1)*(1-pq/v);}
function alpha(M){const k=M[0].length;if(M.length<3)return NaN;const tot=M.map(r=>r.reduce((s,x)=>s+x,0));const v=vr(tot);if(!v)return NaN;let s=0;for(let j=0;j<k;j++)s+=vr(M.map(r=>r[j]));return k/(k-1)*(1-s/v);}
/* ---- Formato (estilo APA en español) ---- */
const nn=x=>Number.isFinite(x);
const f1=x=>nn(x)?x.toFixed(1).replace('.',','):'—', f2k=x=>nn(x)?x.toFixed(2).replace('.',','):'—';
const f2=x=>nn(x)?x.toFixed(2).replace('.',',').replace(/^0,/,',').replace(/^-0,/,'-,'):'—';
const fp=p=>!nn(p)?'—':(p<.001?'< ,001':'= '+p.toFixed(3).replace('0.',','));


function wilson(k,n){if(!n)return[NaN,NaN];const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h),Math.min(1,c+h)];}
const pc=x=>nn(x)?Math.round(x*100)+'\u00a0%':'—';
const num=(r,k)=>Number(r[k]);
const okv=r=>META.map((_,i)=>Number(r['C'+(i+1)+'_ok'])||0);
const bv=(r,k)=>[...Array(18)].map((_,i)=>Number(r['B'+(i+1)+'_'+k])||0);
const SKEY='ccpe-panel-clave';
const ss={get(){try{return sessionStorage.getItem(SKEY)}catch(e){return null}},set(v){try{sessionStorage.setItem(SKEY,v)}catch(e){}},del(){try{sessionStorage.removeItem(SKEY)}catch(e){}}};

/* ================= Acceso ================= */
let D=null, ALL=[], F={A2:'',A7:'',A9:''}, CRIT=7;
function pedirDatos(clave){
  return fetch(API,{method:'POST',body:JSON.stringify({accion:'datos',clave})}).then(r=>r.json()).then(d=>{if(!d||!d.ok)throw new Error((d&&d.error)||'Respuesta no válida.');return d;});
}
function pantallaAcceso(msg){
  $('#who').innerHTML='';
  $('#app').innerHTML=`<div class="panel login"><p class="eyebrow">Acceso restringido</p><h2 style="margin:8px 0 8px">Panel de evaluadores</h2>
  <p class="muted">Introduce la contraseña personal que te ha facilitado el responsable del estudio.</p>
  <form id="lf"><label for="pw">Contraseña<input class="t" id="pw" type="password" autocomplete="current-password" required></label>
  <div style="margin-top:18px"><button class="btn" id="lb" type="submit">Entrar</button></div></form>
  ${msg?`<div class="err">${esc(msg)}</div>`:''}</div>`;
  $('#pw').focus();
  $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#pw').value;$('#lb').disabled=true;$('#lb').textContent='Comprobando…';
    pedirDatos(v).then(d=>{ss.set(v);cargado(d);}).catch(err=>pantallaAcceso(err.message==='Failed to fetch'?'Sin conexión con el servidor.':err.message));};
}
function cerrar(){ss.del();D=null;ALL=[];pantallaAcceso();}
function recargar(){const c=ss.get();if(!c)return pantallaAcceso();$('#stamp')&&($('#stamp').textContent='Actualizando…');
  pedirDatos(c).then(cargado).catch(err=>{ss.del();pantallaAcceso(err.message);});}
function cargado(d){
  D=d;CRIT=Number(d.criterio)||7;
  ALL=d.filas.map(f=>{const o={};d.cabeceras.forEach((h,i)=>o[h]=f[i]);return o;});
  $('#who').innerHTML=`<span>Conectado como <b>${esc(d.evaluador)}</b></span><button class="linkbtn" id="out">Cerrar sesión</button>`;
  $('#out').onclick=cerrar;
  marco();pintar();
}

/* ================= Estructura de la página ================= */
function opciones(k){const c={};ALL.forEach(r=>{const v=String(r[k]||'');if(v)c[v]=(c[v]||0)+1;});return Object.keys(c).sort((a,b)=>a.localeCompare(b,'es'));}
function marco(){
  const sel=(k,lab)=>`<label class="f" for="f-${k}">${lab}<select class="t" id="f-${k}"><option value="">Todos</option>${opciones(k).map(o=>`<option ${F[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  $('#app').innerHTML=`<p class="eyebrow">Datos reales · Diseño solo postest</p>
  <h1 style="margin-top:8px">¿Han alcanzado los asistentes los objetivos del diplomado?</h1>
  <p class="muted" style="margin-top:10px;max-width:72ch">Un asistente alcanza los objetivos de un módulo si acierta al menos <b class="num" style="color:var(--accent)">${CRIT}</b> de sus 10 preguntas, y los del diplomado si lo consigue en los tres módulos.</p>
  <div class="bar"><span class="muted" id="stamp"></span><div class="grow">${D.hoja?`<a class="btn ghost" href="${esc(D.hoja)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir la hoja de cálculo</a>`:''}<button class="btn ghost" id="rl">Actualizar</button></div></div>
  <div class="panel tools"><b class="noprint" style="font-weight:700;font-size:13px;align-self:center;margin-right:4px">Filtrar</b>${sel('A2','País')}${sel('A7','Perfil profesional')}${sel('A9','Evaluaciones previas')}<label class="qual noprint" for="exq"><input type="checkbox" id="exq" ${EXQ?'checked':''}> Excluir sospechosos (<span id="nsos">0</span>)</label>
   <div class="exp"><button class="btn ghost" id="x-csv">Datos (CSV)</button><button class="btn ghost" id="x-xlsx">Datos y tablas (Excel)</button><button class="btn" id="x-pdf">Informe (PDF)</button></div></div>
  <p class="printonly" id="pfilt" style="margin-top:12px"></p>
  <div class="tiles kpis" id="kpis" style="margin-top:14px"></div><div id="body"></div>`;
  ['A2','A7','A9'].forEach(k=>$('#f-'+k).onchange=e=>{F[k]=e.target.value;pintar();});
  $('#exq').onchange=e=>{EXQ=e.target.checked;pintar();};
  $('#rl').onclick=recargar;
  $('#x-csv').onclick=exportCSV; $('#x-xlsx').onclick=exportXLSX; $('#x-pdf').onclick=()=>{try{window.print();}catch(e){}};
}
const filtradas=()=>ALL.filter(r=>Object.keys(F).every(k=>!F[k]||String(r[k])===F[k])&&(!EXQ||!sospechas(r).length));
const filtroTxt=()=>{const t=[['A2','País'],['A7','Perfil'],['A9','Evaluaciones previas']].filter(([k])=>F[k]).map(([k,l])=>`${l}: ${F[k]}`);return t.length?t.join(' · '):'Sin filtros (todos los asistentes)';};

/* ================= Análisis ================= */
function analizar(R){
  const n=R.length, A={n};
  if(!n)return A;
  A.glob=R.filter(r=>num(r,'logro_global')===1).length; A.globCI=wilson(A.glob,n);
  A.tot=R.map(r=>num(r,'C_total'));
  A.nk=mean(R.map(r=>num(r,'C_no_lo_se')))/30;
  const durs=R.map(r=>num(r,'duracion_seg')).filter(x=>x>0).sort((a,b)=>a-b); A.dur=durs.length?durs[Math.floor(durs.length/2)]:NaN;
  A.mods=[1,2,3].map(m=>{const c=R.map(r=>num(r,'C_M'+m));const k=R.filter(r=>num(r,'logro_M'+m)===1).length;return{c,k,p:k/n,ci:wilson(k,n)};});
  A.ses=[0,1,2,3,4,5].map(s=>mean(R.map(r=>okv(r).slice(s*5,s*5+5).reduce((a,b)=>a+b,0)/5)));
  A.grupos=['0','1-3','4-10','Más de 10'].map(g=>{const q=R.filter(r=>String(r.A9)===g);const k=q.filter(r=>num(r,'logro_global')===1).length;return{g,n:q.length,k,p:q.length?k/q.length:NaN};});
  A.bm=[1,2,3].map(m=>({a:R.map(r=>num(r,'B_antes_M'+m)),b:R.map(r=>num(r,'B_ahora_M'+m))}));
  A.bt={a:R.map(r=>num(r,'B_antes_media')),b:R.map(r=>num(r,'B_ahora_media'))};
  A.tM=A.bm.map(m=>paired(m.a,m.b)); A.tT=paired(A.bt.a,A.bt.b);
  A.r=pearson(A.tot,A.bt.b);
  const M=R.map(okv); A.kr20=kr20(M); A.aA=alpha(R.map(r=>bv(r,'antes'))); A.aB=alpha(R.map(r=>bv(r,'ahora')));
  const totI=M.map(r=>r.reduce((s,x)=>s+x,0));
  A.items=META.map((k,j)=>{const col=M.map(r=>r[j]);const p=mean(col);const rit=pearson(col,totI.map((t,i)=>t-col[i]));const dk=R.filter(r=>r['C'+(j+1)]==='E').length/n;
    return{id:k.id,ses:k.ses,lvl:k.lvl,p,rit,dk,flag:(nn(p)&&(p<.2||p>.9))||(nn(rit)&&rit<.2)};});
  const sv=(r,id)=>Number(r[id]);
  A.satItems=SATG.flatMap(g=>g.items.map(([id,l])=>{const v=R.map(r=>sv(r,id)).filter(x=>x>=1&&x<=5);const c=[1,2,3,4,5].map(k=>v.filter(x=>x===k).length);return{id,l,g:g.c,n:v.length,m:mean(v),sd:sd(v),c,ps:v.length?(c[3]+c[4])/v.length:NaN};}));
  A.satComp=SATG.map(g=>{const v=R.map(r=>num(r,g.k)).filter(x=>x>=1);const it=g.items.map(([id])=>id);const M=R.map(r=>it.map(id=>sv(r,id))).filter(row=>row.every(x=>x>=1));
    const ind=R.map(r=>it.map(id=>sv(r,id))).filter(row=>row.every(x=>x>=1)).map(row=>mean(row));
    return{c:g.c,n:v.length,m:mean(v),sd:sd(v),ps:ind.length?ind.filter(x=>x>=4).length/ind.length:NaN,alpha:it.length>1&&M.length>2?alpha(M):NaN};});
  A.R=R; return A;
}

/* ================= Pintar ================= */
function pintar(){
  const R=filtradas(), A=analizar(R), n=A.n;
  $('#stamp').textContent='Actualizado: '+new Date().toLocaleString('es-ES')+' · '+ALL.length+' cuestionarios en total';
  $('#pfilt').textContent='Filtros: '+filtroTxt()+' · n = '+n;
  ['x-csv','x-xlsx','x-pdf'].forEach(id=>$('#'+id).disabled=!n);
  $('#nsos').textContent=sosp().length;
  if(!n){$('#kpis').innerHTML='';$('#body').innerHTML=`<div class="panel wait"><span class="pill acc">Sin datos</span><p>${ALL.length?'Ningún cuestionario cumple los filtros elegidos.':'Todavía no hay respuestas. El panel se irá llenando a medida que los asistentes respondan.'}</p></div>`;return;}
  $('#kpis').innerHTML=[[n,'cuestionarios'+(n<ALL.length?' (filtrados)':'')],[pc(A.glob/n),`alcanzan los objetivos del diplomado (IC 95 %: ${pc(A.globCI[0])}-${pc(A.globCI[1])})`],[f1(mean(A.tot))+' / 30','aciertos medios'],[pc(A.nk),'respuestas «No lo sé»'],[nn(A.dur)?Math.round(A.dur/60)+' min':'—','duración mediana']]
    .map(([v,k])=>`<div class="tile"><div class="v num">${v}</div><div class="k">${k}</div></div>`).join('');

const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));};
const phi=z=>0.5*(1+erf(z/Math.SQRT2));
const pR=(r,n)=>{if(!nn(r)||n<4||Math.abs(r)>=1)return NaN;const t=r*Math.sqrt((n-2)/(1-r*r));return pT(t,n-2);};
function welch(a,b){const n1=a.length,n2=b.length;if(n1<2||n2<2)return{t:NaN,df:NaN,p:NaN,d:NaN};const v1=vr(a)/n1,v2=vr(b)/n2;const t=(mean(a)-mean(b))/Math.sqrt(v1+v2);const df=(v1+v2)**2/(v1*v1/(n1-1)+v2*v2/(n2-1));const sp=Math.sqrt(((n1-1)*vr(a)+(n2-1)*vr(b))/(n1+n2-2));return{t,df,p:pT(t,df),d:(mean(a)-mean(b))/sp};}
function zprop(k1,n1,k2,n2){if(!n1||!n2)return NaN;const p=(k1+k2)/(n1+n2);const se=Math.sqrt(p*(1-p)*(1/n1+1/n2));if(!se)return NaN;const z=(k1/n1-k2/n2)/se;return 2*(1-phi(Math.abs(z)));}

function sospechas(r){
  const m=[], d=num(r,'duracion_seg');
  if(d>0&&d<600)m.push('menos de 10 minutos');
  const D=[...Array(13)].map((_,i)=>num(r,'D'+(i+1))).filter(x=>x>=1);
  if(D.length===13&&new Set(D).size===1)m.push('misma respuesta en toda la satisfacción');
  const a=bv(r,'antes'),b=bv(r,'ahora');
  if(new Set(a).size===1&&new Set(b).size===1)m.push('misma respuesta en toda la autopercepción');
  if(num(r,'C_no_lo_se')>=25)m.push('«No lo sé» en 25 o más preguntas');
  const C=[...Array(30)].map((_,i)=>r['C'+(i+1)]);
  if(new Set(C).size===1&&C[0]!=='E')m.push('misma opción en todas las preguntas');
  return m;
}

  const cor=vars.map(([l,f])=>{const[x,y]=pairs(f);const r=pearson(x,y);return{l,n:x.length,r,p:pR(r,x.length)};});

  let s=`<svg viewBox="0 0 ${W} 230" role="img" aria-label="Logro según asistencia">`;
  [0,.25,.5,.75,1].forEach(v=>{const y=190-160*v;s+=`<line class="grid" x1="40" y1="${y}" x2="${W}" y2="${y}"/><text x="32" y="${y+4}" text-anchor="end">${v*100}</text>`;});
  grp.forEach((g,i)=>{const x=90+i*140,hh=nn(g.p)?160*g.p:0;s+=`<rect x="${x}" y="${190-hh}" width="80" height="${hh}" fill="#63002F" fill-opacity="${.45+i*.27}" data-tip="<b>${g.g} sesiones</b><br>${g.k} de ${g.n} alcanzan los objetivos (${pc(g.p)})<br>Aciertos medios: ${f1(g.m)} / 30"/><text x="${x+40}" y="${190-hh-8}" text-anchor="middle" class="v">${g.n?pc(g.p):'—'}</text><text x="${x+40}" y="208" text-anchor="middle" class="v">${g.g} sesiones</text><text x="${x+40}" y="224" text-anchor="middle">n = ${g.n}</text>`;});
  s+='</svg>';
  // gráfico 2: satisfacción frente a aciertos
  const w=W-40,h=180,px=v=>40+(w-10)*v/30,py=v=>14+h-h*(v-1)/4;
  let s2=`<svg viewBox="0 0 ${W} 240" role="img" aria-label="Satisfacción frente a aciertos">`;
  [1,2,3,4,5].forEach(v=>{s2+=`<line class="grid" x1="40" y1="${py(v)}" x2="${W}" y2="${py(v)}"/><text x="32" y="${py(v)+4}" text-anchor="end">${v}</text>`;});
  [0,10,20,30].forEach(v=>s2+=`<text x="${px(v)}" y="${14+h+18}" text-anchor="middle">${v}</text>`);
  R.forEach((r,i)=>{const x=num(r,'C_total'),y=satm[i];if(nn(x)&&nn(y))s2+=`<circle cx="${px(x)}" cy="${py(y)}" r="4" fill="#63002F" fill-opacity=".6" data-tip="${x} aciertos · satisfacción ${f1(y)}"/>`;});
  const cs=cor[3];
  s2+=`<text x="${W/2}" y="234" text-anchor="middle">Aciertos (0-30) · eje vertical: satisfacción media (1-5) · r = ${f2(cs.r)}</text></svg>`;
  return `<section class="sec"><p class="eyebrow">Relaciones</p><h2>Qué se asocia con el logro</h2>
  <div class="charts"><div class="panel chart"><h3>Logro según la asistencia</h3><p class="sub">Porcentaje que alcanza los objetivos del diplomado según las sesiones sincrónicas a las que asistió (A15)</p>${s}</div>
  <div class="panel chart"><h3>Satisfacción y aciertos</h3><p class="sub">Cada punto es un asistente: aciertos frente a satisfacción media</p>${s2}</div></div>
  <div class="panel tbl"><table><caption><b style="color:var(--text);font-weight:700">Tabla 5.</b> Correlaciones de Pearson entre la puntuación en la prueba de conocimientos (0-30) y otras variables. Son asociaciones, no relaciones causales.</caption>
  <thead><tr><th>Variable</th><th>n</th><th>r</th><th>p</th></tr></thead><tbody>${cor.map(c=>`<tr><td>${c.l}</td><td class="num">${c.n}</td><td class="num">${f2(c.r)}</td><td class="num">${fp(c.p)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ================= Comparar dos grupos ================= */
const CMPV={A2:'País',A7:'Perfil profesional',A9:'Evaluaciones previas como par',A15g:'Sesiones asistidas'};
const grupoDe=(r,v)=>v==='A15g'?(String(r.A15)===''?'':(num(r,'A15')<=2?'0-2':num(r,'A15')<=4?'3-4':'5-6')):String(r[v]||'');
function comparar(R){
  const vals=[...new Set(R.map(r=>grupoDe(r,CMP.v)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(!vals.includes(CMP.a))CMP.a=vals[0]||'';
  if(!vals.includes(CMP.b)||CMP.b===CMP.a)CMP.b=vals.find(v=>v!==CMP.a)||'';
  const sel=(id,cur)=>`<select class="t" id="${id}">${vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  let body='<p class="muted" style="margin-top:12px">Hacen falta al menos dos grupos con respuestas para comparar.</p>';
  if(CMP.a&&CMP.b){
    const G1=R.filter(r=>grupoDe(r,CMP.v)===CMP.a),G2=R.filter(r=>grupoDe(r,CMP.v)===CMP.b);
    const prop=(lab,k)=>{const k1=G1.filter(r=>num(r,k)===1).length,k2=G2.filter(r=>num(r,k)===1).length;const p1=k1/(G1.length||1),p2=k2/(G2.length||1);return[lab,pc(G1.length?p1:NaN),pc(G2.length?p2:NaN),G1.length&&G2.length?(Math.round((p1-p2)*100)+' pp'):'—','z: p '+fp(zprop(k1,G1.length,k2,G2.length)),p1,p2];};
    const med=(lab,k)=>{const a=G1.map(r=>num(r,k)).filter(nn),b=G2.map(r=>num(r,k)).filter(nn);const t=welch(a,b);return[lab,f2k(mean(a)),f2k(mean(b)),f2k(mean(a)-mean(b)),`t(${nn(t.df)?f1(t.df):'—'}) = ${f2k(t.t)}, p ${fp(t.p)}, d = ${f2k(t.d)}`];};
    const rows=[['n',G1.length,G2.length,'',''],prop('Alcanzan los objetivos del diplomado','logro_global'),prop('Logro del Módulo 1','logro_M1'),prop('Logro del Módulo 2','logro_M2'),prop('Logro del Módulo 3','logro_M3'),
      med('Aciertos (0-30)','C_total'),med('Autopercepción «ahora» (1-5)','B_ahora_media'),med('Satisfacción global (1-5)','Sat_global')];
    const bars=rows.slice(1,5);let s=`<svg viewBox="0 0 ${W} 220" role="img" aria-label="Comparación del logro">`;
    [0,.5,1].forEach(v=>{const y=180-150*v;s+=`<line class="grid" x1="40" y1="${y}" x2="${W}" y2="${y}"/><text x="32" y="${y+4}" text-anchor="end">${v*100}</text>`;});
    bars.forEach((b,i)=>{const x=60+i*115;[[b[5],CMP.a,1],[b[6],CMP.b,.45]].forEach(([p,g,o],j)=>{const hh=nn(p)?150*p:0;s+=`<rect x="${x+j*42}" y="${180-hh}" width="38" height="${hh}" fill="#63002F" fill-opacity="${o}" data-tip="<b>${tp(g)}</b><br>${tp(b[0])}: ${pc(p)}"/><text x="${x+j*42+19}" y="${180-hh-6}" text-anchor="middle" class="v" style="font-size:10px">${pc(p)}</text>`;});
      s+=`<text x="${x+40}" y="198" text-anchor="middle" class="v">${['Diplomado','Módulo 1','Módulo 2','Módulo 3'][i]}</text>`;});
    s+=`<g transform="translate(60,212)"><rect width="12" height="8" fill="#63002F"/><text x="16" y="8">${esc(CMP.a)}</text><rect x="200" width="12" height="8" fill="#63002F" fill-opacity=".45"/><text x="216" y="8">${esc(CMP.b)}</text></g></svg>`;
    body=`<div class="panel chart" style="margin-top:14px"><h3>Logro: ${esc(CMP.a)} frente a ${esc(CMP.b)}</h3><p class="sub">Porcentaje que alcanza el criterio en cada módulo y en el diplomado</p><div style="max-width:680px">${s}</div></div>
    <div class="panel tbl"><table><caption><b style="color:var(--text);font-weight:700">Tabla 6.</b> Comparación de grupos (${esc(CMPV[CMP.v])}). Proporciones: prueba z; medias: t de Welch y d de Cohen. Con grupos pequeños, interpretar con cautela.</caption>
    <thead><tr><th>Indicador</th><th>${esc(CMP.a)}</th><th>${esc(CMP.b)}</th><th>Diferencia</th><th>Contraste</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num" style="font-size:12px;white-space:nowrap">${r[4]}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<div class="panel tools noprint" style="margin-top:14px"><label class="f" for="cv">Comparar por<select class="t" id="cv">${Object.entries(CMPV).map(([k,l])=>`<option value="${k}" ${k===CMP.v?'selected':''}>${l}</option>`).join('')}</select></label>
   <label class="f" for="ca">Grupo 1${sel('ca',CMP.a)}</label><label class="f" for="cb">Grupo 2${sel('cb',CMP.b)}</label></div>
   <p class="printonly">Comparación por ${esc(CMPV[CMP.v])}: ${esc(CMP.a)} frente a ${esc(CMP.b)}</p>${body}`;
}
function pintarComparar(R){const el=$('#cmp');if(!el)return;el.innerHTML=comparar(R);
  $('#cv')&&($('#cv').onchange=e=>{CMP={v:e.target.value,a:'',b:''};pintarComparar(R);botonesPNG();});
  $('#ca')&&($('#ca').onchange=e=>{CMP.a=e.target.value;pintarComparar(R);botonesPNG();});
  $('#cb')&&($('#cb').onchange=e=>{CMP.b=e.target.value;pintarComparar(R);botonesPNG();});}

/* ================= Borrador de resultados ================= */
const num1=x=>f1(x), mdesc=(a)=>`M = ${f2k(mean(a))}, DE = ${f2k(sd(a))}`;
function borrador(A){
  const n=A.n, ins=inscritos.get(), out=[];
  const excl=EXQ?sosp().length:0;
  out.push(`Respondieron el cuestionario ${ALL.length} asistentes${ins?` de los ${ins} inscritos en el diplomado, lo que supone una tasa de respuesta del ${pc(ALL.length/ins)}`:''}.${excl?` Se excluyeron ${excl} cuestionarios por presentar indicios de respuesta poco atenta (tiempo inferior a 10 minutos o patrones de respuesta invariables), por lo que la muestra analizada quedó formada por ${n} asistentes.`:''}${filtroTxt().startsWith('Sin filtros')?'':` Los resultados se refieren al subgrupo: ${filtroTxt()}.`}`);
  const m=A.mods;
  const bajo=A.ses.map((v,i)=>[v,i]).filter(([v])=>v<CRIT/10).map(([v,i])=>`la ${i+1} (${pc(v)})`);
  out.push(`En la prueba de conocimientos, la puntuación media fue de ${f2k(mean(A.tot))} aciertos sobre 30 (DE = ${f2k(sd(A.tot))}). El ${pc(A.glob/n)} de los asistentes (IC 95 %: ${pc(A.globCI[0])}-${pc(A.globCI[1])}) alcanzó los objetivos del diplomado, es decir, obtuvo al menos ${CRIT} aciertos de 10 en cada uno de los tres módulos. Por módulos, el porcentaje de logro fue del ${pc(m[0].p)} en el Módulo 1 (${MODS[0]}), del ${pc(m[1].p)} en el Módulo 2 (${MODS[1]}) y del ${pc(m[2].p)} en el Módulo 3 (${MODS[2]}).${bajo.length?` Las sesiones cuyo porcentaje medio de aciertos quedó por debajo del criterio fueron ${bajo.join(', ').replace(/, ([^,]*)$/,' y $1')}.`:' Todas las sesiones superaron el criterio en el porcentaje medio de aciertos.'}`);
  out.push(`En cuanto a la competencia autopercibida, los asistentes valoraron su nivel antes del diplomado con una media de ${f2k(mean(A.bt.a))} (DE = ${f2k(sd(A.bt.a))}) y su nivel actual con una media de ${f2k(mean(A.bt.b))} (DE = ${f2k(sd(A.bt.b))}) en una escala de 1 a 5. La diferencia fue estadísticamente ${A.tT.p<.05?'significativa':'no significativa'}, t(${A.tT.df}) = ${f2k(A.tT.t)}, p ${fp(A.tT.p)}, d<sub>z</sub> = ${f2k(A.tT.dz)}. Al tratarse de una medida retrospectiva, este resultado refleja el cambio percibido por los participantes y no un cambio medido. La correlación entre la puntuación en la prueba y la competencia autopercibida actual fue de r = ${f2(A.r)}.`);
  if(A.satComp&&A.satComp.some(s=>s.n)){const sc=A.satComp;const it=A.satItems.filter(i=>i.n&&i.id!=='D13').sort((a,b)=>a.m-b.m);
    out.push(`La satisfacción global con el diplomado obtuvo una media de ${f2k(sc[3].m)} (DE = ${f2k(sc[3].sd)}) sobre 5. Por componentes, la media fue de ${f2k(sc[0].m)} en contenidos, de ${f2k(sc[1].m)} en instructores y de ${f2k(sc[2].m)} en logística y dinámicas de las sesiones.${it.length?` El aspecto mejor valorado fue «${it[it.length-1].l.toLowerCase()}» (M = ${f2k(it[it.length-1].m)}) y el peor valorado, «${it[0].l.toLowerCase()}» (M = ${f2k(it[0].m)}).`:''}`);}
  if(A.rel){const c=A.rel.cor;const ses=c[0],sat=c[3];
    out.push(`En relación con la participación, la correlación entre el número de sesiones sincrónicas a las que se asistió y la puntuación en la prueba fue de r = ${f2(ses.r)} (p ${fp(ses.p)}), y la correlación entre la satisfacción media y la puntuación fue de r = ${f2(sat.r)} (p ${fp(sat.p)}).`);}
  out.push(`En cuanto a la fiabilidad, la prueba de conocimientos obtuvo un coeficiente KR-20 de ${f2(A.kr20)}, y la escala de competencia autopercibida, un α de Cronbach de ${f2(A.aA)} en la valoración «antes» y de ${f2(A.aB)} en la valoración «ahora».`);
  return out;
}
function pintarBorrador(A){const el=$('#borr');if(!el)return;const ps=borrador(A);
  el.innerHTML=`<div class="panel" style="padding:20px 22px;margin-top:14px"><div id="btxt" style="max-width:78ch">${ps.map(p=>`<p style="margin:0 0 12px;line-height:1.65">${p}</p>`).join('')}</div>
  <div class="noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px"><button class="btn" id="bcopy">Copiar el texto</button><span class="muted" id="bmsg" style="font-size:13px">Revisa el texto antes de usarlo: es un borrador generado con las cifras del panel y los filtros activos.</span></div></div>`;
  $('#bcopy').onclick=()=>{const txt=ps.map(p=>p.replace(/<sub>z<\/sub>/g,'z').replace(/<[^>]+>/g,'')).join('\n\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{$('#bmsg').textContent='Texto copiado.';}).catch(()=>{const r=document.createRange();r.selectNodeContents($('#btxt'));const s=window.getSelection();s.removeAllRanges();s.addRange(r);$('#bmsg').textContent='Texto seleccionado: pulsa Ctrl+C (o Cmd+C) para copiarlo.';});};}

/* ================= Descargar gráficos en PNG ================= */
function botonesPNG(){
  document.querySelectorAll('.panel.chart').forEach(ch=>{const svg=ch.querySelector('svg');if(!svg||ch.querySelector('.pngbtn'))return;
    const b=document.createElement('button');b.className='pngbtn noprint';b.type='button';b.textContent='PNG';b.title='Descargar este gráfico como imagen';b.setAttribute('aria-label','Descargar el gráfico como imagen PNG');
    b.onclick=()=>svgPNG(ch);ch.style.position='relative';ch.appendChild(b);});
}
function svgPNG(ch){
  const svg=ch.querySelector('svg'),title=(ch.querySelector('h3')||{}).textContent||'grafico',sub=(ch.querySelector('.sub')||{}).textContent||'';
  const vb=svg.viewBox.baseVal,sc=2,Wp=vb.width*sc,Hs=vb.height*sc;
  const cl=svg.cloneNode(true);const src=svg.querySelectorAll('*'),dst=cl.querySelectorAll('*');
  src.forEach((el,i)=>{const cs=getComputedStyle(el),d=dst[i];['fill','stroke','stroke-width','stroke-dasharray','fill-opacity','opacity','font-size','font-weight','text-anchor'].forEach(p=>{const v=cs.getPropertyValue(p);if(v)d.style.setProperty(p,v);});d.style.setProperty('font-family','Open Sans, Arial, sans-serif');d.removeAttribute('class');d.removeAttribute('data-tip');});
  cl.setAttribute('width',Wp);cl.setAttribute('height',Hs);cl.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl));
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const x=c.getContext('2d');const CW=Wp+80;
    x.font='22px Open Sans, Arial, sans-serif';const lines=[];let ln='';sub.split(' ').forEach(w=>{const tst=ln?ln+' '+w:w;if(x.measureText(tst).width>CW-80&&ln){lines.push(ln);ln=w;}else ln=tst;});if(ln)lines.push(ln);
    const top2=70+lines.length*28+12;c.width=CW;c.height=top2+Hs+44;
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#63002F';x.font='bold 30px Open Sans, Arial, sans-serif';x.fillText(title,40,52);
    x.fillStyle='#6c5e65';x.font='22px Open Sans, Arial, sans-serif';lines.forEach((l,i)=>x.fillText(l,40,88+i*28));x.drawImage(img,40,top2);
    x.fillStyle='#9a8a92';x.font='18px Open Sans, Arial, sans-serif';x.fillText('CCPE-RIACES 2026 · n = '+filtradas().length+' · '+new Date().toLocaleDateString('es-ES'),40,c.height-14);
    c.toBlob(bl=>descargar(bl,'ccpe-riaces-2026_'+title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.png'),'image/png');};
  img.onerror=()=>alertBox('No se ha podido generar la imagen del gráfico.');img.src=url;
}

/* ================= Inicio ================= */
if(!API){$('#app').innerHTML='<div class="err">Falta configurar la dirección del servidor en config.js.</div>';}
else if(ss.get()){$('#app').innerHTML='<p class="muted" style="margin-top:40px">Cargando datos…</p>';recargar();}
else pantallaAcceso();
</script>
