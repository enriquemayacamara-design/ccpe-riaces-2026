<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de evaluadores · CCPE-RIACES 2026</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<style>
main{padding:30px 0 40px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0 18px}
.bar .grow{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.kpis{grid-template-columns:repeat(5,1fr)}
.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.chart{padding:18px}
.chart h3{margin-bottom:4px}
.chart .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block}
.chart svg text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chart svg text.v{fill:var(--text);font-weight:600}
.chart svg .grid{stroke:var(--line)}
.chart svg .ink{stroke:var(--text)}
.chart svg .hole{fill:var(--bg);stroke:var(--text)}
.wait{padding:22px;margin-top:14px;display:flex;gap:14px;align-items:center;border-left:4px solid var(--accent)}
.tbl{padding:18px;margin-top:14px;overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tbl th,.tbl td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child,.tbl td.l,.tbl th.l{text-align:left}
.tbl thead th{border-top:1.5px solid var(--text);border-bottom:1.5px solid var(--text);font-weight:600;font-size:12px}
.tbl caption{text-align:left;font-size:13px;color:var(--muted);padding-bottom:8px;caption-side:top}
.flag{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:1px}
.hb{display:grid;grid-template-columns:minmax(120px,220px) 1fr 40px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hb i{display:block;height:12px;background:var(--accent);border-radius:2px}
.sec{margin-top:34px}
.sec>h2{margin-bottom:4px}
.err{margin-top:16px;padding:12px 16px;border-radius:8px;border-left:4px solid var(--red);background:var(--red-soft)}
/* acceso */
.login{max-width:440px;margin:70px auto;padding:30px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);margin-top:18px}
input.t,select.t{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--text);font:inherit;font-weight:400}
input.t:focus,select.t:focus{border-color:var(--accent);outline:none}
/* barra de herramientas */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;margin-top:18px}
.tools .f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tools .f select{min-width:170px;text-transform:none;letter-spacing:0;font-size:14px}
.tools .exp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.who{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.who b{color:var(--text);font-weight:600}
.linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0;text-decoration:underline}
.printonly{display:none}
@media (max-width:900px){.charts{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.tools .exp{margin-left:0}}
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#fff;--line:#c9d3d0;--text:#000;--muted:#444;color-scheme:light}
  header.top{position:static;background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top .brandtxt b{color:#fff}header.top .brandtxt span{color:#b8c4c0}
  .who{display:none!important}
  .tools,.bar .grow,.noprint,.linkbtn{display:none!important}
  .printonly{display:block}
  .panel{break-inside:avoid}
  .sec{break-before:auto}
  .charts{grid-template-columns:1fr 1fr}
  body{font-size:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img src="assets/logo.png" alt="EMC · La Clase de Kike">
  <div class="brandtxt"><b>CCPE-RIACES 2026 · Panel de evaluadores</b><span>Diplomado Internacional de Pares Académicos Evaluadores</span></div>
  <div class="who" id="who"></div>
</div></header>

<main class="wrap" id="app"></main>
<footer class="ft"><div class="wrap"><span>Enrique Maya Cámara · La Clase de Kike · Docencia, Calidad e Investigación</span><span>Intervalos de confianza del 95 % por el método de Wilson · p exacta de la t de Student.</span></div></footer>

<script src="config.js"></script>
<script src="assets/meta.js"></script>
<script src="assets/vendor/xlsx.full.min.js"></script>
<script>
const API=(window.CCPE_CONFIG||{}).API_URL||'';
const META=window.CCPE_META;
const MODS=['Perspectiva iberoamericana','Actuación estratégica','Innovación y juicio evaluativo'];
const SESS=['Comparación de sistemas y marcos','Indicadores, evidencias y juicio','Antes de la visita','Durante y después de la visita','IA, microcredenciales y trayectorias','Hallazgos, recomendaciones e informes'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---- Estadística ---- */
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
const vr=a=>{const m=mean(a);return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1);};
function pearson(x,y){if(x.length<3)return NaN;const mx=mean(x),my=mean(y);let n=0,dx=0,dy=0;for(let i=0;i<x.length;i++){n+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2;}return dx&&dy?n/Math.sqrt(dx*dy):NaN;}
// p bilateral exacta de la t de Student (beta incompleta regularizada)
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(const ci of c)s+=ci/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-7)break;}return h;}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
const pT=(t,df)=>ibeta(df/2,0.5,df/(df+t*t));
function paired(a,b){const d=b.map((v,i)=>v-a[i]);const n=d.length,md=mean(d),s=sd(d);if(n<2||!s)return{md,dz:NaN,t:NaN,df:n-1,p:NaN};const t=md/(s/Math.sqrt(n));return{md,dz:md/s,t,df:n-1,p:pT(t,n-1)};}
function kr20(M){const k=M[0].length;if(M.length<3)return NaN;const tot=M.map(r=>r.reduce((s,x)=>s+x,0));const v=vr(tot);if(!v)return NaN;let pq=0;for(let j=0;j<k;j++){const p=mean(M.map(r=>r[j]));pq+=p*(1-p);}return k/(k-1)*(1-pq/v);}
function alpha(M){const k=M[0].length;if(M.length<3)return NaN;const tot=M.map(r=>r.reduce((s,x)=>s+x,0));const v=vr(tot);if(!v)return NaN;let s=0;for(let j=0;j<k;j++)s+=vr(M.map(r=>r[j]));return k/(k-1)*(1-s/v);}
/* ---- Formato (estilo APA en español) ---- */
const nn=x=>Number.isFinite(x);
const f1=x=>nn(x)?x.toFixed(1).replace('.',','):'—', f2k=x=>nn(x)?x.toFixed(2).replace('.',','):'—';
const f2=x=>nn(x)?x.toFixed(2).replace('.',',').replace(/^0,/,',').replace(/^-0,/,'-,'):'—';
const fp=p=>!nn(p)?'—':(p<.001?'< ,001':'= '+p.toFixed(3).replace('0.',','));


function wilson(k,n){if(!n)return[NaN,NaN];const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h),Math.min(1,c+h)];}
const pc=x=>nn(x)?Math.round(x*100)+' %':'—';
const num=(r,k)=>Number(r[k]);
const okv=r=>META.map((_,i)=>Number(r['C'+(i+1)+'_ok'])||0);
const bv=(r,k)=>[...Array(18)].map((_,i)=>Number(r['B'+(i+1)+'_'+k])||0);
const SKEY='ccpe-panel-clave';
const ss={get(){try{return sessionStorage.getItem(SKEY)}catch(e){return null}},set(v){try{sessionStorage.setItem(SKEY,v)}catch(e){}},del(){try{sessionStorage.removeItem(SKEY)}catch(e){}}};

/* ================= Acceso ================= */
let D=null, ALL=[], F={A2:'',A7:'',A9:''}, CRIT=7;
function pedirDatos(clave){
  return fetch(API,{method:'POST',body:JSON.stringify({accion:'datos',clave})}).then(r=>r.json()).then(d=>{if(!d||!d.ok)throw new Error((d&&d.error)||'Respuesta no válida.');return d;});
}
function pantallaAcceso(msg){
  $('#who').innerHTML='';
  $('#app').innerHTML=`<div class="panel login"><p class="eyebrow">Acceso restringido</p><h2 style="margin:8px 0 8px">Panel de evaluadores</h2>
  <p class="muted">Introduce la contraseña personal que te ha facilitado el responsable del estudio.</p>
  <form id="lf"><label for="pw">Contraseña<input class="t" id="pw" type="password" autocomplete="current-password" required></label>
  <div style="margin-top:18px"><button class="btn" id="lb" type="submit">Entrar</button></div></form>
  ${msg?`<div class="err">${esc(msg)}</div>`:''}</div>`;
  $('#pw').focus();
  $('#lf').onsubmit=e=>{e.preventDefault();const v=$('#pw').value;$('#lb').disabled=true;$('#lb').textContent='Comprobando…';
    pedirDatos(v).then(d=>{ss.set(v);cargado(d);}).catch(err=>pantallaAcceso(err.message==='Failed to fetch'?'Sin conexión con el servidor.':err.message));};
}
function cerrar(){ss.del();D=null;ALL=[];pantallaAcceso();}
function recargar(){const c=ss.get();if(!c)return pantallaAcceso();$('#stamp')&&($('#stamp').textContent='Actualizando…');
  pedirDatos(c).then(cargado).catch(err=>{ss.del();pantallaAcceso(err.message);});}
function cargado(d){
  D=d;CRIT=Number(d.criterio)||7;
  ALL=d.filas.map(f=>{const o={};d.cabeceras.forEach((h,i)=>o[h]=f[i]);return o;});
  $('#who').innerHTML=`<span>Conectado como <b>${esc(d.evaluador)}</b></span><button class="linkbtn" id="out">Cerrar sesión</button>`;
  $('#out').onclick=cerrar;
  marco();pintar();
}

/* ================= Estructura de la página ================= */
function opciones(k){const c={};ALL.forEach(r=>{const v=String(r[k]||'');if(v)c[v]=(c[v]||0)+1;});return Object.keys(c).sort((a,b)=>a.localeCompare(b,'es'));}
function marco(){
  const sel=(k,lab)=>`<label class="f" for="f-${k}">${lab}<select class="t" id="f-${k}"><option value="">Todos</option>${opciones(k).map(o=>`<option ${F[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  $('#app').innerHTML=`<p class="eyebrow">Datos reales · Diseño solo postest</p>
  <h1 style="margin-top:8px">¿Han alcanzado los asistentes los objetivos del diplomado?</h1>
  <p class="muted" style="margin-top:10px;max-width:72ch">Un asistente alcanza los objetivos de un módulo si acierta al menos <b class="num" style="color:var(--text)">${CRIT}</b> de sus 10 preguntas, y los del diplomado si lo consigue en los tres módulos.</p>
  <div class="bar"><span class="muted" id="stamp"></span><div class="grow">${D.hoja?`<a class="btn ghost" href="${esc(D.hoja)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir la hoja de cálculo</a>`:''}<button class="btn ghost" id="rl">Actualizar</button></div></div>
  <div class="panel tools"><b class="noprint" style="font-weight:700;font-size:13px;align-self:center;margin-right:4px">Filtrar</b>${sel('A2','País')}${sel('A7','Perfil profesional')}${sel('A9','Evaluaciones previas')}
   <div class="exp"><button class="btn ghost" id="x-csv">Datos (CSV)</button><button class="btn ghost" id="x-xlsx">Datos y tablas (Excel)</button><button class="btn" id="x-pdf">Informe (PDF)</button></div></div>
  <p class="printonly" id="pfilt" style="margin-top:12px"></p>
  <div class="tiles kpis" id="kpis" style="margin-top:14px"></div><div id="body"></div>`;
  ['A2','A7','A9'].forEach(k=>$('#f-'+k).onchange=e=>{F[k]=e.target.value;pintar();});
  $('#rl').onclick=recargar;
  $('#x-csv').onclick=exportCSV; $('#x-xlsx').onclick=exportXLSX; $('#x-pdf').onclick=()=>{try{window.print();}catch(e){}};
}
const filtradas=()=>ALL.filter(r=>Object.keys(F).every(k=>!F[k]||String(r[k])===F[k]));
const filtroTxt=()=>{const t=[['A2','País'],['A7','Perfil'],['A9','Evaluaciones previas']].filter(([k])=>F[k]).map(([k,l])=>`${l}: ${F[k]}`);return t.length?t.join(' · '):'Sin filtros (todos los asistentes)';};

/* ================= Análisis ================= */
function analizar(R){
  const n=R.length, A={n};
  if(!n)return A;
  A.glob=R.filter(r=>num(r,'logro_global')===1).length; A.globCI=wilson(A.glob,n);
  A.tot=R.map(r=>num(r,'C_total'));
  A.nk=mean(R.map(r=>num(r,'C_no_lo_se')))/30;
  const durs=R.map(r=>num(r,'duracion_seg')).filter(x=>x>0).sort((a,b)=>a-b); A.dur=durs.length?durs[Math.floor(durs.length/2)]:NaN;
  A.mods=[1,2,3].map(m=>{const c=R.map(r=>num(r,'C_M'+m));const k=R.filter(r=>num(r,'logro_M'+m)===1).length;return{c,k,p:k/n,ci:wilson(k,n)};});
  A.ses=[0,1,2,3,4,5].map(s=>mean(R.map(r=>okv(r).slice(s*5,s*5+5).reduce((a,b)=>a+b,0)/5)));
  A.grupos=['0','1-3','4-10','Más de 10'].map(g=>{const q=R.filter(r=>String(r.A9)===g);const k=q.filter(r=>num(r,'logro_global')===1).length;return{g,n:q.length,k,p:q.length?k/q.length:NaN};});
  A.bm=[1,2,3].map(m=>({a:R.map(r=>num(r,'B_antes_M'+m)),b:R.map(r=>num(r,'B_ahora_M'+m))}));
  A.bt={a:R.map(r=>num(r,'B_antes_media')),b:R.map(r=>num(r,'B_ahora_media'))};
  A.tM=A.bm.map(m=>paired(m.a,m.b)); A.tT=paired(A.bt.a,A.bt.b);
  A.r=pearson(A.tot,A.bt.b);
  const M=R.map(okv); A.kr20=kr20(M); A.aA=alpha(R.map(r=>bv(r,'antes'))); A.aB=alpha(R.map(r=>bv(r,'ahora')));
  const totI=M.map(r=>r.reduce((s,x)=>s+x,0));
  A.items=META.map((k,j)=>{const col=M.map(r=>r[j]);const p=mean(col);const rit=pearson(col,totI.map((t,i)=>t-col[i]));const dk=R.filter(r=>r['C'+(j+1)]==='E').length/n;
    return{id:k.id,ses:k.ses,lvl:k.lvl,p,rit,dk,flag:(nn(p)&&(p<.2||p>.9))||(nn(rit)&&rit<.2)};});
  A.R=R; return A;
}

/* ================= Pintar ================= */
function pintar(){
  const R=filtradas(), A=analizar(R), n=A.n;
  $('#stamp').textContent='Actualizado: '+new Date().toLocaleString('es-ES')+' · '+ALL.length+' cuestionarios en total';
  $('#pfilt').textContent='Filtros: '+filtroTxt()+' · n = '+n;
  ['x-csv','x-xlsx','x-pdf'].forEach(id=>$('#'+id).disabled=!n);
  if(!n){$('#kpis').innerHTML='';$('#body').innerHTML=`<div class="panel wait"><span class="pill acc">Sin datos</span><p>${ALL.length?'Ningún cuestionario cumple los filtros elegidos.':'Todavía no hay respuestas. El panel se irá llenando a medida que los asistentes respondan.'}</p></div>`;return;}
  $('#kpis').innerHTML=[[n,'cuestionarios'+(n<ALL.length?' (filtrados)':'')],[pc(A.glob/n),`alcanzan los objetivos del diplomado (IC 95 %: ${pc(A.globCI[0])}-${pc(A.globCI[1])})`],[f1(mean(A.tot))+' / 30','aciertos medios'],[pc(A.nk),'respuestas «No lo sé»'],[nn(A.dur)?Math.round(A.dur/60)+' min':'—','duración mediana']]
    .map(([v,k])=>`<div class="tile"><div class="v num">${v}</div><div class="k">${k}</div></div>`).join('');
  let h=`<section class="sec"><p class="eyebrow">Logro de objetivos</p><h2>Qué parte de los asistentes alcanza cada objetivo</h2>
  <div class="charts"><div class="panel chart"><h3>Logro por módulo</h3><p class="sub">Porcentaje de asistentes con al menos ${CRIT} de 10 aciertos, con su IC del 95 %</p>${logroChart(A)}</div>
  <div class="panel chart"><h3>Aciertos por sesión</h3><p class="sub">Porcentaje medio de aciertos en las 5 preguntas de cada sesión; la línea roja marca el ${CRIT*10} %</p>${sesChart(A.ses)}</div></div>
  <div class="panel tbl"><table><caption><b style="color:var(--text);font-weight:700">Tabla 1.</b> Aciertos y logro de objetivos por módulo (n = ${n}; criterio: ≥ ${CRIT} de 10).</caption><thead><tr><th>Módulo</th><th>Aciertos M (DE)</th><th>Alcanzan el criterio</th><th>%</th><th>IC 95 %</th></tr></thead><tbody>
  ${tabla1(A).map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td></tr>`).join('')}</tbody></table></div>
  <div class="charts"><div class="panel chart"><h3>Distribución de la puntuación total</h3><p class="sub">Número de asistentes por tramo de aciertos (0-30)</p>${hist(A.tot)}</div>
  <div class="panel chart"><h3>Logro según experiencia previa</h3><p class="sub">Porcentaje que alcanza los objetivos del diplomado según sus evaluaciones previas como par (A9)</p>${grupos(A.grupos)}</div></div></section>`;
  h+=`<section class="sec"><p class="eyebrow">Autopercepción retrospectiva</p><h2>Cómo valoran su competencia antes y después</h2>
  <div class="charts"><div class="panel chart"><h3>Antes y ahora, por módulo</h3><p class="sub">Media de la escala 1-5: antes del diplomado (círculo hueco) y ahora (verde)</p>${dumb(A)}</div>
  <div class="panel chart"><h3>Calibración</h3><p class="sub">Cada punto es un asistente: conocimiento real frente a competencia que se atribuye ahora. r = ${f2(A.r)}</p>${calib(A)}</div></div>
  <div class="panel tbl"><table><caption><b style="color:var(--text);font-weight:700">Tabla 2.</b> Competencia autopercibida retrospectiva: antes del diplomado frente a ahora, con la t de Student para muestras relacionadas (n = ${n}; gl = ${n-1}).</caption><thead><tr><th>Escala (1-5)</th><th>Antes M (DE)</th><th>Ahora M (DE)</th><th>t</th><th>p</th><th>d<sub>z</sub></th></tr></thead><tbody>
  ${tabla2(A).map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td class="num">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  h+=`<section class="sec"><p class="eyebrow">Validación del instrumento</p><h2>Fiabilidad y análisis de ítems</h2>
  <div class="tiles kpis" style="margin-top:14px;grid-template-columns:repeat(3,1fr)">
   <div class="tile"><div class="v num">${f2(A.kr20)}</div><div class="k">KR-20 de la prueba de conocimientos</div></div>
   <div class="tile"><div class="v num">${f2(A.aA)}</div><div class="k">α de Cronbach · autopercepción «antes»</div></div>
   <div class="tile"><div class="v num">${f2(A.aB)}</div><div class="k">α de Cronbach · autopercepción «ahora»</div></div></div>
  <div class="panel tbl"><table><caption><b style="color:var(--text);font-weight:700">Tabla 3.</b> Análisis de ítems de la prueba de conocimientos (n = ${n}). El punto rojo marca ítems con p &lt; ,20, p &gt; ,90 o r<sub>it</sub> &lt; ,20.</caption><thead><tr><th>Ítem</th><th class="l">Sesión</th><th class="l">Nivel</th><th>p (dificultad)</th><th>r<sub>it</sub> corregida</th><th>«No lo sé»</th></tr></thead><tbody>
  ${A.items.map(it=>`<tr><td>${it.id}${it.flag?'<span class="flag" title="Revisar: dificultad extrema o discriminación baja"></span>':''}</td><td class="l">${it.ses}</td><td class="l">${it.lvl}</td><td class="num">${f2(it.p)}</td><td class="num">${f2(it.rit)}</td><td class="num">${pc(it.dk)}</td></tr>`).join('')}</tbody></table></div></section>`;
  const cnt=(k,multi)=>{const c={};R.forEach(r=>{String(r[k]||'').split(multi?'; ':'§').filter(Boolean).forEach(v=>c[v]=(c[v]||0)+1);});return Object.entries(c).sort((a,b)=>b[1]-a[1]);};
  const hbars=e=>{const mx=Math.max(1,...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><i style="width:${v/mx*100}%"></i><span class="num muted">${v}</span></div>`).join('')||'<p class="muted">Sin datos.</p>';};
  h+=`<section class="sec"><p class="eyebrow">Bloque A</p><h2>Perfil de la muestra y participación</h2><div class="charts">
   <div class="panel chart"><h3>País</h3>${hbars(cnt('A2'))}</div><div class="panel chart"><h3>Perfil profesional</h3>${hbars(cnt('A7'))}</div>
   <div class="panel chart"><h3>Evaluaciones previas como par</h3>${hbars(cnt('A9'))}</div><div class="panel chart"><h3>Sesiones sincrónicas a las que asistió</h3>${hbars(cnt('A15').sort((a,b)=>Number(b[0])-Number(a[0])))}</div></div></section>`;
  $('#body').innerHTML=h;
}
function tabla1(A){const n=A.n;return[...A.mods.map((m,i)=>['Módulo '+(i+1)+' · '+MODS[i],`${f2k(mean(m.c))} (${f2k(sd(m.c))})`,m.k,pc(m.p),`${pc(m.ci[0])}-${pc(m.ci[1])}`]),
  ['Diplomado (los tres módulos)',`${f2k(mean(A.tot))} (${f2k(sd(A.tot))}) de 30`,A.glob,pc(A.glob/n),`${pc(A.globCI[0])}-${pc(A.globCI[1])}`]];}
function tabla2(A){const row=(lab,a,b,t)=>[lab,`${f2k(mean(a))} (${f2k(sd(a))})`,`${f2k(mean(b))} (${f2k(sd(b))})`,f2k(t.t),fp(t.p),f2k(t.dz)];
  return[...A.bm.map((m,i)=>row('Módulo '+(i+1)+' · '+MODS[i],m.a,m.b,A.tM[i])),row('Total (18 ítems)',A.bt.a,A.bt.b,A.tT)];}

/* ================= Gráficos SVG ================= */
const W=520;
function logroChart(A){
  const rows=[...A.mods.map((m,i)=>({l:'Módulo '+(i+1),s:MODS[i],p:m.p,ci:m.ci})),{l:'Diplomado',s:'los tres módulos',p:A.glob/A.n,ci:A.globCI,t:1}];
  const X0=178,X1=W-50,sx=v=>X0+(X1-X0)*v;let s=`<svg viewBox="0 0 ${W} 250" role="img" aria-label="Porcentaje de logro por módulo">`;
  [0,.25,.5,.75,1].forEach(v=>{s+=`<line class="grid" x1="${sx(v)}" y1="14" x2="${sx(v)}" y2="222"/><text x="${sx(v)}" y="240" text-anchor="middle">${v*100} %</text>`;});
  rows.forEach((r,i)=>{const y=34+i*52;s+=`<text x="0" y="${y-2}" class="v">${r.l}</text><text x="0" y="${y+13}">${r.s}</text><rect x="${X0}" y="${y-9}" width="${Math.max(0,sx(r.p)-X0)}" height="18" fill="#00B894" fill-opacity="${r.t?1:.75}"/>`+
    (nn(r.ci[0])?`<g class="ink" stroke-width="1.5"><line x1="${sx(r.ci[0])}" y1="${y}" x2="${sx(r.ci[1])}" y2="${y}"/><line x1="${sx(r.ci[0])}" y1="${y-6}" x2="${sx(r.ci[0])}" y2="${y+6}"/><line x1="${sx(r.ci[1])}" y1="${y-6}" x2="${sx(r.ci[1])}" y2="${y+6}"/></g>`:'')+
    `<text x="${W}" y="${y+4}" text-anchor="end" class="v">${pc(r.p)}</text>`;});
  return s+'</svg>';
}
function sesChart(ses){
  const H=170,Y0=190,sy=v=>Y0-H*v;let s=`<svg viewBox="0 0 ${W} 250" role="img" aria-label="Porcentaje de aciertos por sesión">`;
  [0,.25,.5,.75,1].forEach(v=>{s+=`<line class="grid" x1="40" y1="${sy(v)}" x2="${W}" y2="${sy(v)}"/><text x="32" y="${sy(v)+4}" text-anchor="end">${v*100}</text>`;});
  ses.forEach((v,i)=>{const x=60+i*76;const ok=v>=CRIT/10;s+=`<rect x="${x}" y="${sy(v)}" width="44" height="${H*v}" fill="#00B894" fill-opacity="${ok?1:.4}"/><text x="${x+22}" y="${sy(v)-6}" text-anchor="middle" class="v">${Math.round(v*100)}</text><text x="${x+22}" y="${Y0+16}" text-anchor="middle" class="v">S${i+1}</text><text x="${x+22}" y="${Y0+30}" text-anchor="middle">M${Math.ceil((i+1)/2)}</text>`;});
  return s+`<line x1="40" y1="${sy(CRIT/10)}" x2="${W}" y2="${sy(CRIT/10)}" stroke="#B80024" stroke-width="2" stroke-dasharray="6 4"/><text x="${W}" y="${sy(CRIT/10)-6}" text-anchor="end" class="v">criterio ${CRIT*10} %</text></svg>`;
}
function hist(a){
  const bins=[...Array(10)].map((_,i)=>i*3);const c=bins.map(b=>a.filter(v=>v>=b&&(b===27?v<=30:v<b+3)).length),mx=Math.max(1,...c);const H=180,Y0=200;
  let s=`<svg viewBox="0 0 ${W} 250" role="img" aria-label="Histograma de puntuaciones">`;const tick=Math.max(1,Math.ceil(mx/4));
  for(let v=0;v<=mx;v+=tick){const y=Y0-H*v/mx;s+=`<line class="grid" x1="40" y1="${y}" x2="${W}" y2="${y}"/><text x="32" y="${y+4}" text-anchor="end">${v}</text>`;}
  bins.forEach((b,i)=>{const x=50+i*47,hh=H*c[i]/mx;s+=`<rect x="${x}" y="${Y0-hh}" width="38" height="${hh}" fill="#00B894"/><text x="${x+19}" y="${Y0+16}" text-anchor="middle">${b}-${b===27?30:b+2}</text>`;});
  return s+`<line class="ink" x1="40" y1="${Y0}" x2="${W}" y2="${Y0}"/></svg>`;
}
function grupos(G){
  let s=`<svg viewBox="0 0 ${W} 230" role="img" aria-label="Logro según experiencia">`;
  [0,.25,.5,.75,1].forEach(v=>{const y=190-160*v;s+=`<line class="grid" x1="40" y1="${y}" x2="${W}" y2="${y}"/><text x="32" y="${y+4}" text-anchor="end">${v*100}</text>`;});
  G.forEach((g,i)=>{const x=80+i*110,hh=nn(g.p)?160*g.p:0;s+=`<rect x="${x}" y="${190-hh}" width="64" height="${hh}" fill="#00B894" fill-opacity="${1-i*.18}"/><text x="${x+32}" y="${190-hh-8}" text-anchor="middle" class="v">${g.n?pc(g.p):'—'}</text><text x="${x+32}" y="208" text-anchor="middle" class="v">${g.g}</text><text x="${x+32}" y="224" text-anchor="middle">n = ${g.n}</text>`;});
  return s+'</svg>';
}
function dumb(A){
  const rows=[...A.bm.map((m,i)=>({l:'Módulo '+(i+1),s:MODS[i],a:mean(m.a),b:mean(m.b),dz:A.tM[i].dz})),{l:'Total',s:'18 ítems',a:mean(A.bt.a),b:mean(A.bt.b),dz:A.tT.dz}];
  const X0=150,X1=W-60,sx=v=>X0+(X1-X0)*(v-1)/4;let s=`<svg viewBox="0 0 ${W} 250" role="img" aria-label="Autopercepción antes y ahora">`;
  [1,2,3,4,5].forEach(v=>{s+=`<line class="grid" x1="${sx(v)}" y1="14" x2="${sx(v)}" y2="222"/><text x="${sx(v)}" y="240" text-anchor="middle">${v}</text>`;});
  rows.forEach((r,i)=>{const y=34+i*52;s+=`<text x="0" y="${y-2}" class="v">${r.l}</text><text x="0" y="${y+13}">${r.s}</text><line x1="${sx(r.a)}" y1="${y}" x2="${sx(r.b)}" y2="${y}" stroke="#00B894" stroke-width="3"/><circle class="hole" cx="${sx(r.a)}" cy="${y}" r="7" stroke-width="2"/><circle cx="${sx(r.b)}" cy="${y}" r="8" fill="#00B894"/><text x="${sx(Math.min(r.a,r.b))-12}" y="${y+4}" text-anchor="end">${f1(r.a)}</text><text x="${sx(Math.max(r.a,r.b))+13}" y="${y+4}" class="v">${f1(r.b)}</text><text x="${W}" y="${y+4}" text-anchor="end">dz ${f2k(r.dz)}</text>`;});
  return s+'</svg>';
}
function calib(A){
  const w=W-40,h=180,px=v=>40+(w-10)*v/30,py=v=>14+h-h*(v-1)/4;let s=`<svg viewBox="0 0 ${W} 240" role="img" aria-label="Calibración">`;
  [1,2,3,4,5].forEach(v=>{s+=`<line class="grid" x1="40" y1="${py(v)}" x2="${W}" y2="${py(v)}"/><text x="32" y="${py(v)+4}" text-anchor="end">${v}</text>`;});
  [0,10,20,30].forEach(v=>s+=`<text x="${px(v)}" y="${14+h+18}" text-anchor="middle">${v}</text>`);
  A.tot.forEach((x,i)=>{const ok=num(A.R[i],'logro_global')===1;s+=ok?`<circle cx="${px(x)}" cy="${py(A.bt.b[i])}" r="4" fill="#00B894" fill-opacity=".85"/>`:`<circle class="hole" cx="${px(x)}" cy="${py(A.bt.b[i])}" r="3.5" stroke-width="1.2"/>`;});
  return s+`<text x="${W/2}" y="234" text-anchor="middle">Aciertos (0-30) · eje vertical: autopercepción «ahora» (1-5) · verde: alcanza los objetivos</text></svg>`;
}

/* ================= Exportar ================= */
const stamp=()=>new Date().toISOString().slice(0,10);
function descargar(blob,nombre){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportCSV(){
  const R=filtradas(),H=D.cabeceras;
  const cell=v=>{const s=v==null?'':String(v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const txt='﻿'+[H.join(';'),...R.map(r=>H.map(h=>cell(typeof r[h]==='number'?String(r[h]).replace('.',','):r[h])).join(';'))].join('\r\n');
  descargar(new Blob([txt],{type:'text/csv;charset=utf-8'}),`ccpe-riaces-2026_datos_${stamp()}.csv`);
}

  if(typeof XLSX==='undefined'){alertBox('No se ha podido cargar la librería de Excel. Comprueba la conexión y vuelve a intentarlo.');return;}

  const add=(name,aoa,cols)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);if(cols)ws['!cols']=cols.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name);};
  add('Resumen',[['CCPE-RIACES 2026 · Logro de objetivos del diplomado'],['Exportado',new Date().toLocaleString('es-ES')],['Exportado por',D.evaluador],['Filtros',filtroTxt()],['Criterio',`≥ ${CRIT} de 10 aciertos por módulo; diplomado: los tres módulos`],[],
    ['Indicador','Valor'],['Cuestionarios',n],['Alcanzan los objetivos del diplomado (%)',+(A.glob/n*100).toFixed(1)],['IC 95 % inferior (%)',+(A.globCI[0]*100).toFixed(1)],['IC 95 % superior (%)',+(A.globCI[1]*100).toFixed(1)],['Aciertos medios (0-30)',+mean(A.tot).toFixed(2)],['Respuestas «No lo sé» (%)',+(A.nk*100).toFixed(1)],['KR-20',+A.kr20.toFixed(3)],['α autopercepción antes',+A.aA.toFixed(3)],['α autopercepción ahora',+A.aB.toFixed(3)],['r conocimiento-autopercepción ahora',+A.r.toFixed(3)],[],
    ['Tabla 1. Logro por módulo'],['Módulo','Aciertos M','Aciertos DE','Alcanzan el criterio','%','IC 95 % inf.','IC 95 % sup.'],
    ...A.mods.map((m,i)=>['Módulo '+(i+1)+' · '+MODS[i],+mean(m.c).toFixed(2),+sd(m.c).toFixed(2),m.k,+(m.p*100).toFixed(1),+(m.ci[0]*100).toFixed(1),+(m.ci[1]*100).toFixed(1)]),
    ['Diplomado (tres módulos)',+mean(A.tot).toFixed(2),+sd(A.tot).toFixed(2),A.glob,+(A.glob/n*100).toFixed(1),+(A.globCI[0]*100).toFixed(1),+(A.globCI[1]*100).toFixed(1)],[],
    ['Aciertos por sesión'],['Sesión','Título','% medio de aciertos'],...A.ses.map((v,i)=>['S'+(i+1),SESS[i],+(v*100).toFixed(1)]),[],
    ['Logro según evaluaciones previas (A9)'],['Grupo','n','Alcanzan','%'],...A.grupos.map(g=>[g.g,g.n,g.k,g.n?+(g.p*100).toFixed(1):''])],[38,14,14,18,10,12,12]);
  add('Autopercepción',[['Tabla 2. Competencia autopercibida retrospectiva (t para muestras relacionadas)'],['Escala','Antes M','Antes DE','Ahora M','Ahora DE','t','gl','p','dz'],
    ...[...A.bm.map((m,i)=>['Módulo '+(i+1)+' · '+MODS[i],m.a,m.b,A.tM[i]]),['Total (18 ítems)',A.bt.a,A.bt.b,A.tT]].map(([l,a,b,t])=>[l,+mean(a).toFixed(2),+sd(a).toFixed(2),+mean(b).toFixed(2),+sd(b).toFixed(2),+t.t.toFixed(2),t.df,t.p<.001?'<0,001':+t.p.toFixed(3),+t.dz.toFixed(2)]),[],
    ['Por ítem'],['Ítem','Antes M','Ahora M','Diferencia'],...[...Array(18)].map((_,i)=>{const a=R.map(r=>num(r,'B'+(i+1)+'_antes')),b=R.map(r=>num(r,'B'+(i+1)+'_ahora'));return['B'+(i+1),+mean(a).toFixed(2),+mean(b).toFixed(2),+(mean(b)-mean(a)).toFixed(2)];})],[34,10,10,10,10,8,6,9,8]);
  add('Ítems',[['Tabla 3. Análisis de ítems de la prueba de conocimientos'],['Ítem','Sesión','Nivel','p (dificultad)','r_it corregida','% No lo sé','Revisar'],

  XLSX.writeFile(wb,`ccpe-riaces-2026_resultados_${stamp()}.xlsx`);
}
